<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <div class="content-wrapper">
            <h1 class="title">SSC 2026 রেজাল্ট</h1>
            <p class="subtitle">10 আগস্ট 2026 | সকাল 10:00</p>
            
            <div class="timer-display">
                <div class="timer-item">
                    <span id="days" class="timer-value">00</span>
                    <span class="timer-label">দিন</span>
                </div>
                <div class="separator">:</div>
                <div class="timer-item">
                    <span id="hours" class="timer-value">00</span>
                    <span class="timer-label">ঘণ্টা</span>
                </div>
                <div class="separator">:</div>
                <div class="timer-item">
                    <span id="minutes" class="timer-value">00</span>
                    <span class="timer-label">মিনিট</span>
                </div>
                <div class="separator">:</div>
                <div class="timer-item">
                    <span id="seconds" class="timer-value">00</span>
                    <span class="timer-label">সেকেন্ড</span>
                </div>
            </div>
            
            <div id="finished-msg" class="finished-message">
                <h2>🎉 সময় শেষ হয়েছে!</h2>
                <p>ইভেন্ট শুরু হয়েছে</p>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
