<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Countdown Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>
    <div class="bg-grid"></div>

    <main class="container">
        <div class="content-wrapper">
            <span class="eyebrow">countdown</span>
            <h1 class="title">New Chapter Begins</h1>
            <p class="subtitle">30 June 2031 • 12:00 PM</p>

            <div class="progress-section" aria-label="Countdown progress">
                <div class="progress-header">
                    <span>প্রগতি</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <div class="timer-display" aria-live="polite">
                <div class="timer-item">
                    <span id="days" class="timer-value">00</span>
                    <span class="timer-label">Days</span>
                </div>
                <div class="separator">:</div>
                <div class="timer-item">
                    <span id="hours" class="timer-value">00</span>
                    <span class="timer-label">Hours</span>
                </div>
                <div class="separator">:</div>
                <div class="timer-item">
                    <span id="minutes" class="timer-value">00</span>
                    <span class="timer-label">Minutes</span>
                </div>
                <div class="separator">:</div>
                <div class="timer-item">
                    <span id="seconds" class="timer-value">00</span>
                    <span class="timer-label">Seconds</span>
                </div>
            </div>

            <div id="finished-msg" class="finished-message" aria-live="polite">
                <div class="finished-icon">🎉</div>
                <h2>Time is here!</h2>
                <p>The next moment has started.</p>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
